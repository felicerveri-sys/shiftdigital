// Boton primario (Rojo Carmesi) / secundario (borde) / claro.
// Si recibe "href" se renderiza como link; si no, como <button>.
function Boton({ href, variante = "primario", tamano = "md", children, className = "", ...props }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-all duration-200 focus:outline-none focus-visible:ring-4 focus-visible:ring-[#FF4655]/30";
  const variantes = {
    primario:   "bg-[#FF4655] text-white shadow-lg shadow-[#FF4655]/25 hover:bg-red-600 hover:shadow-xl hover:shadow-[#FF4655]/30 hover:-translate-y-0.5 active:translate-y-0",
    secundario: "border border-gray-300 bg-white text-[#121212] hover:border-[#121212] hover:bg-gray-50",
    claro:      "bg-white text-[#121212] hover:bg-gray-100",
  };
  const tamanos = {
    md: "px-6 py-3 text-sm sm:text-base",
    lg: "px-8 py-4 text-base sm:text-lg",
    xl: "px-9 py-5 text-lg sm:text-xl",
  };
  const clases = base + " " + variantes[variante] + " " + tamanos[tamano] + " " + className;
  if (!href) {
    return <button type="button" className={clases} {...props}>{children}</button>;
  }
  return <a href={href} className={clases} {...props}>{children}</a>;
}

// Revela el contenido al entrar en viewport
function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      function (entries) {
        if (entries[0].isIntersecting) { el.classList.add("is-visible"); obs.unobserve(el); }
      },
      { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className={"reveal " + className} style={{ animationDelay: delay + "ms" }}>
      {children}
    </div>
  );
}

const Contenedor = ({ children, className = "" }) => (

// Video mudo en loop que NO se descarga hasta que hace falta: hasta entonces
// solo se ve el poster (una imagen de ~30 KB), asi la pagina abre rapido.
//   modo "auto":  arranca cuando entra en pantalla. Para el video del hero.
//   modo "hover": en desktop arranca al pasar el mouse por encima; en celular
//                 (sin mouse) arranca al entrar en pantalla. Para las tarjetas:
//                 evita reproducir los 3 videos a la vez, que traba equipos lentos.
function VideoDemo({ src, poster, modo = "auto", className = "" }) {
  const ref = useRef(null);
  const [reproduciendo, setReproduciendo] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const arrancar = function () {
      el.preload = "auto";
      const p = el.play();
      if (p && p.catch) p.catch(function () {}); // el navegador puede bloquear el autoplay
      setReproduciendo(true);
    };
    const frenar = function () {
      el.pause();
      setReproduciendo(false);
    };

    const hayMouse = window.matchMedia("(hover: hover)").matches;
    if (modo === "hover" && hayMouse) {
      const zona = el.parentElement;
      const salir = function () { frenar(); el.currentTime = 0; };
      zona.addEventListener("mouseenter", arrancar);
      zona.addEventListener("mouseleave", salir);
      return () => {
        zona.removeEventListener("mouseenter", arrancar);
        zona.removeEventListener("mouseleave", salir);
      };
    }

    const obs = new IntersectionObserver(
      function (entries) { entries[0].isIntersecting ? arrancar() : frenar(); },
      { threshold: 0.25 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [modo]);

  return (
    <React.Fragment>
      <video
        ref={ref} src={src} poster={poster} preload="none"
        muted loop playsInline disablePictureInPicture
        className={"h-full w-full object-cover " + className}
      />
      {/* Indicador de "esto es un video" mientras esta en pausa */}
      <span
        aria-hidden="true"
        className={"pointer-events-none absolute bottom-3 left-3 flex h-9 w-9 items-center justify-center rounded-full bg-black/55 text-white backdrop-blur-sm transition-opacity duration-300 " + (reproduciendo ? "opacity-0" : "opacity-100")}
      >
        <svg viewBox="0 0 24 24" className="ml-0.5 h-4 w-4" fill="currentColor"><polygon points="8 5 19 12 8 19" /></svg>
      </span>
    </React.Fragment>
  );
}

/* ============================================================================
   VISOR A PANTALLA COMPLETA
   Abre el video del proyecto en grande, con controles para pausar y adelantar.
   Se cierra con Esc, con la X o tocando fuera del video.
   Ojo: las grabaciones no tienen audio, asi que el visor va mudo.
   ========================================================================== */
function VisorVideo({ proyecto, onCerrar }) {
  const videoRef = useRef(null);

  useEffect(() => {
    if (!proyecto) return;
    const onTecla = function (e) { if (e.key === "Escape") onCerrar(); };
    document.addEventListener("keydown", onTecla);

    // Bloquea el scroll del fondo mientras el visor esta abierto
    const scrollPrevio = document.body.style.overflow;
    document.body.style.overflow = "hidden";

    const v = videoRef.current;
    if (v) { const p = v.play(); if (p && p.catch) p.catch(function () {}); }

    return () => {
      document.removeEventListener("keydown", onTecla);
      document.body.style.overflow = scrollPrevio;
    };
  }, [proyecto, onCerrar]);

  if (!proyecto) return null;

  return (
    <div
      className="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 p-4 backdrop-blur-sm sm:p-8"
      onClick={onCerrar} role="dialog" aria-modal="true" aria-label={proyecto.titulo}
    >
      <div className="relative w-full max-w-6xl" onClick={(e) => e.stopPropagation()}>
        <div className="mb-3 flex items-end justify-between gap-4">
          <div className="min-w-0">
            <p className="text-[11px] font-semibold uppercase tracking-wider text-[#FF4655]">{proyecto.rubro}</p>
            <h3 className="truncate text-lg font-bold tracking-tight text-white sm:text-xl">{proyecto.titulo}</h3>
          </div>
          <button
            type="button" onClick={onCerrar} aria-label="Cerrar"
            className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 text-white transition-colors hover:bg-white/20 focus:outline-none focus-visible:ring-4 focus-visible:ring-white/30"
          >
            <IconoCerrar className="h-5 w-5" />
          </button>
        </div>

        <div className="overflow-hidden rounded-xl bg-black shadow-2xl">
          <video
            ref={videoRef} src={proyecto.video} poster={proyecto.poster}
            controls autoPlay muted loop playsInline
            className="max-h-[72vh] w-full bg-black object-contain"
          />
        </div>

        <p className="mt-3 text-center text-xs text-white/45">
          {/* En celular no hay tecla Esc: se muestra solo la parte que aplica */}
          <span className="sm:hidden">Tocá fuera del video para cerrar · Usá ⛶ para verlo a pantalla completa</span>
          <span className="hidden sm:inline">
            Tocá fuera del video o apretá <kbd className="rounded border border-white/25 px-1.5 py-0.5 font-sans">Esc</kbd> para cerrar
          </span>
        </p>
      </div>
    </div>
  );
}

    "Clientes que se enfrían por no recibir confirmación al instante.",
    "Idas y vueltas interminables para coordinar un horario.",
    "Un perfil de Instagram que no transmite el nivel profesional de tu servicio.",
  ];

  return (
    <section id="problema" className="bg-gray-50 py-20 sm:py-28">
      <Contenedor>
        <div className="mx-auto max-w-3xl text-center">
          <Reveal>
            <h2 className="text-3xl font-extrabold leading-tight tracking-tight text-[#121212] sm:text-4xl lg:text-[2.75rem]">

          <Reveal delay={100}>
            <p className="mt-6 text-base leading-relaxed text-[#666666] sm:text-lg">

        </div>

        <div className="mt-14 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
          {dolores.map((texto, i) => (
            <Reveal key={i} delay={i * 110}>
              <div className="h-full rounded-2xl border border-gray-200 bg-white p-7 transition-shadow duration-300 hover:shadow-lg">
                <span className="text-2xl leading-none" aria-hidden="true">❌</span>
                <p className="mt-4 text-base leading-relaxed text-[#666666]">{texto}</p>
              </div>
            </Reveal>
          ))}
        </div>
      </Contenedor>
    </section>
  );
}

      texto: "Páginas optimizadas para que carguen en un segundo desde el celular, que es de donde vienen el 90% de tus pacientes o clientes.",

        <div className="mt-14 grid gap-10 sm:gap-8 lg:grid-cols-3">

            <Reveal key={titulo} delay={i * 110}>
              <div className="group h-full">
                <span className="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-[#FF4655]/10 text-[#FF4655] transition-colors duration-300 group-hover:bg-[#FF4655] group-hover:text-white">
                  <Icono className="h-7 w-7" />

/* ============================================================================

   ========================================================================== */
function Portafolio() {
  // Proyecto que se esta viendo en grande (null = visor cerrado)
  const [abierto, setAbierto] = useState(null);

  return (
    <section id="trabajos" className="bg-gray-50 py-20 sm:py-28">
      <Contenedor>
        <div className="mx-auto max-w-3xl text-center">
          <Reveal>
            <h2 className="text-3xl font-extrabold leading-tight tracking-tight text-[#121212] sm:text-4xl lg:text-[2.75rem]">
              Mirá cómo podría verse tu próximo sitio.
            </h2>
          </Reveal>
          <Reveal delay={100}>
            <p className="mt-5 text-base text-[#666666] sm:text-lg">
              Proyectos con reserva online integrada a WhatsApp y Google Calendar.
            </p>
          </Reveal>
        </div>

        <div className="mt-14 grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
          {PROYECTOS.map((p, i) => (

              <article className="group flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white transition-all duration-300 hover:-translate-y-1 hover:shadow-xl">

                       Al hacer click se abre en grande en el <VisorVideo />. */}
                <div
                  className="relative aspect-video w-full cursor-pointer overflow-hidden bg-gray-900"
                  onClick={() => setAbierto(p)}
                >
                  <VideoDemo src={p.video} poster={p.poster} modo="hover" />
                </div>

                <div className="flex flex-1 flex-col p-6">
                  <p className="text-xs font-semibold uppercase tracking-wider text-[#FF4655]">{p.rubro}</p>
                  <h3 className="mt-2 text-lg font-bold tracking-tight text-[#121212]">{p.titulo}</h3>
                  <Boton onClick={() => setAbierto(p)} variante="secundario"
                         className="mt-6 w-full !py-3 !text-sm">
                    <IconoExpandir className="h-4 w-4" />
                    Ver en pantalla completa
                  </Boton>
                </div>
              </article>
            </Reveal>
          ))}
        </div>

        {/* ---------- Cierre / CTA final ---------- */}
        <Reveal>
          <div className="mt-20 overflow-hidden rounded-3xl bg-[#121212] px-6 py-14 text-center sm:mt-24 sm:px-12 sm:py-20">
            <h2 className="text-3xl font-extrabold leading-tight tracking-tight text-white sm:text-4xl lg:text-[2.75rem]">

            <p className="mx-auto mt-5 max-w-2xl text-base leading-relaxed text-white/70 sm:text-lg">
              Escribinos por WhatsApp, contanos de qué es tu negocio y te armamos una propuesta sin cargo.
            </p>
            <div className="mt-10 flex justify-center">
              {/* 👉 LINK WHATSAPP (CTA final) */}
              <Boton href={WHATSAPP_URL} target="_blank" rel="noopener noreferrer" tamano="xl" className="w-full sm:w-auto">
                💬 Hablemos por WhatsApp
              </Boton>
            </div>
            <p className="mt-6 text-sm text-white/50">Respuesta en menos de 24 hs · Presupuesto sin cargo</p>
          </div>
        </Reveal>
      </Contenedor>

      {/* Visor a pantalla completa (solo se monta cuando hay un proyecto abierto) */}
      <VisorVideo proyecto={abierto} onCerrar={() => setAbierto(null)} />
    </section>
  );
}

/* ============================================================================

   ========================================================================== */
function Footer() {
  return (
    <footer className="bg-white pt-10 pb-24 sm:pb-10">
      <Contenedor>
        <div className="flex flex-col items-center justify-between gap-6 border-t border-gray-100 pt-8 sm:flex-row">
          <Logo size="sm" />
          <p className="text-xs text-[#666666]">

          <div className="flex items-center gap-5 text-xs font-medium text-[#666666]">

            {/* 👉 LINK WHATSAPP (footer) */}
            <a href={WHATSAPP_URL} target="_blank" rel="noopener noreferrer" className="transition-colors hover:text-[#121212]">WhatsApp</a>

    >
      <IconoWhatsApp className="h-7 w-7" />

  );
}

/* ============================================================================
   APP
   ========================================================================== */
function App() {
  return (
    <React.Fragment>
      <Navbar />
      <main>
        <Hero />
        <Problema />
        <Solucion />
        <Portafolio />
      </main>
      <Footer />

</script>
